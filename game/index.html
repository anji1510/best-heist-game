<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDNIGHT VAULT — a heist game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0c14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="MIDNIGHT VAULT: slip past the guards' vision cones, the security cameras' magenta beams, the laser tripwires and the skylight searchlight's wide white sweep, or crawl the service duct unseen, find the keycard, crack the vault dial and reach the getaway van before the police arrive"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
